name: Shell compatibility

on:
  pull_request:
  push:

jobs:
  zsh-bash-source:
    name: zsh and bash source helpers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run issue 67 shell regression
        run: bash tests/test-issue-67-zsh-bash-source.sh
